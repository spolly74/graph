# Domain schema for the Azure Machine Learning docs knowledge graph.
#
# Owner: Scott. Status: v0.2, approved by Scott 2026-10-15 (drafted by Claude Code).
# v0.2 (Phase 2): ConditionType replaces DomainConditionType and includes the
# core values; DomainEntity carries the generic relationships so SHACL can
# check their domain and range.
# Derived from eval/competency_questions.md. Each relationship notes the
# competency questions (CQ) that need it, so unused ones are easy to prune.
#
# Class names match the ckg:domainClass values in vocab/vocabulary.ttl.
# Entity, Assertion, Condition, and Provenance come from core.yaml.

id: https://example.org/ckg/domain  # TODO(Scott): real namespace, same base as the vocabulary
name: ckg_domain
title: Azure Machine Learning domain schema
version: 0.1.0
license: CC0

prefixes:
  linkml: https://w3id.org/linkml/
  ckg: https://example.org/ckg/
  ckgd: https://example.org/ckg/domain/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: ckgd
default_range: string

imports:
  - linkml:types
  - core

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enums:
  ReleaseStatus:
    description: Lifecycle stage of a product, feature, or API. (CQ 32, 33)
    permissible_values:
      preview:
      generally_available:
      deprecated:
      retired:

  ConditionType:
    description: >-
      Range of Condition.type in core.yaml. Must include every value of
      core's CoreConditionType; the rest are this domain's additions.
    permissible_values:
      # core values
      version:
      role:
      environment:
      time:
      other:
      # domain values
      region:
        description: Applies only in listed Azure regions. (CQ 8)
      release_status:
        description: Applies only while in preview, or only when GA. (CQ 1, 23, 32)
      interface:
        description: Applies only through a given interface (SDK, CLI, studio, REST). (CQ 1)
      endpoint_type:
        description: Applies only to one endpoint type. (CQ 7)
      model_flavor:
        description: Applies only to one MLflow model flavor. (CQ 11)
      network_mode:
        description: Applies only in one managed network isolation mode. (CQ 15)
      workspace_configuration:
        description: Applies only with CMK, private endpoints, or another workspace setting. (CQ 18)
      task_type:
        description: Applies only to one AutoML task type. (CQ 23)

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  Lifecycle:
    mixin: true
    description: Release status and retirement data for things that ship and retire.
    slots:
      - release_status
      - retirement_date

  DomainEntity:
    is_a: Entity
    abstract: true
    description: >-
      Base class for every domain class. Holds the relationships whose
      subject can be any domain entity, so each one appears as a property
      in the generated SHACL shapes with its range checked.
    slots:
      - supports
      - requires
      - part_of
      - has_part
      - replaced_by
      - incompatible_with
      - integrates_with
      - runs_on
      - deployable_to
      - accepts_input_from
      - available_in
      - supports_auth_method
      - uses_identity
      - requires_role
      - backed_by
      - uses_algorithm
      - supports_task
      - has_input
      - has_output
      - defined_by_schema
      - computes_metric
      - has_limit
      - affects
      - differs_from

  # --- Products and interfaces -----------------------------------------------

  Product:
    is_a: DomainEntity
    mixins: [Lifecycle]
    description: A product or platform, such as Azure Machine Learning, Microsoft Foundry, MLflow, or ONNX.

  Interface:
    is_a: DomainEntity
    mixins: [Lifecycle]
    description: A way to work with the service, such as CLI v2, Python SDK v2, REST API, studio, Bicep, or Terraform.

  Capability:
    is_a: DomainEntity
    mixins: [Lifecycle]
    description: A product feature or practice, such as automated ML, safe rollout, or model data collection.

  # --- Azure Machine Learning resources ---------------------------------------

  Resource:
    is_a: DomainEntity
    mixins: [Lifecycle]
    description: Something you create and manage in Azure Machine Learning, such as a workspace, registry, datastore, or connection.

  ComputeTarget:
    is_a: Resource
    description: A compute resource for jobs or endpoints, such as a compute cluster, compute instance, serverless compute, or Kubernetes compute.
    slots:
      - has_gpu_support

  Endpoint:
    is_a: Resource
    description: An endpoint type that serves inference, such as a managed online, Kubernetes online, batch, or serverless API endpoint.

  Deployment:
    is_a: Resource
    description: A deployment that runs behind an endpoint, such as an online, batch, or pipeline component deployment.
    slots:
      - hosted_by

  FeatureStoreEntity:
    is_a: Resource
    description: >-
      A managed feature store concept, such as a feature store, entity,
      materialization, or retrieval specification. Relationships among them
      use part_of, requires, and has_input. (CQ 22)

  # --- Assets and types ------------------------------------------------------

  Asset:
    is_a: DomainEntity
    mixins: [Lifecycle]
    description: A versioned asset, such as a data asset, model, environment, component, feature set, or flow.
    slots:
      - contains_framework
      - shareable_via

  DesignerComponent:
    is_a: Asset
    description: A prebuilt designer component, such as Split Data or Train Model. (CQ 26)

  PromptFlowTool:
    is_a: Asset
    description: A built-in prompt flow tool, such as the LLM tool or the Python tool.

  DataType:
    is_a: DomainEntity
    description: A data asset or input type, such as uri_file, uri_folder, or mltable. (CQ 21)

  ModelType:
    is_a: DomainEntity
    description: A model asset type or format, such as custom_model, mlflow_model, or triton_model. (CQ 11)

  Framework:
    is_a: DomainEntity
    description: An ML framework or library, such as PyTorch, TensorFlow, scikit-learn, or LightGBM. (CQ 28)
    slots:
      - framework_version

  Job:
    is_a: DomainEntity
    description: A job type, such as a command, sweep, pipeline, parallel, Spark, or AutoML job. (CQ 25)
    slots:
      - pipeline_step_type

  AutomlTask:
    is_a: DomainEntity
    description: An AutoML task type, such as classification, forecasting, or image object detection. (CQ 23)

  Algorithm:
    is_a: DomainEntity
    description: A training algorithm or model architecture, such as LightGBM, Prophet, TCNForecaster, or ResNet. (CQ 23, 24)

  YamlSchema:
    is_a: DomainEntity
    description: A CLI v2 YAML schema that defines an entity type. (CQ 29)

  # --- Azure services and security ------------------------------------------

  AzureService:
    is_a: DomainEntity
    description: An Azure service the workspace depends on or integrates with, such as Azure Key Vault, Azure Container Registry, or AKS.

  SecurityConcept:
    is_a: DomainEntity
    description: A network or data protection mechanism, such as a managed virtual network, private endpoint, or customer-managed key.
    slots:
      - secures
      - encrypts
      - allows_outbound_to

  IdentityConcept:
    is_a: DomainEntity
    description: An identity or authentication mechanism, such as a managed identity, service principal, key auth, or Microsoft Entra token.

  Role:
    is_a: DomainEntity
    description: An Azure RBAC role, built-in or custom. (CQ 12, 13)
    slots:
      - grants

  Permission:
    is_a: DomainEntity
    description: An RBAC operation string, such as Microsoft.MachineLearningServices/workspaces/computes/write. (CQ 13)

  Policy:
    is_a: DomainEntity
    description: An Azure Policy definition that applies to Azure Machine Learning. (CQ 19)
    slots:
      - policy_effect
      - enforces

  Region:
    is_a: DomainEntity
    description: An Azure region, such as East US 2. (CQ 8)

  # --- Facts that carry values or text --------------------------------------

  Limit:
    is_a: DomainEntity
    description: A quota or service limit with a value, such as "Workspace name, 2-32 characters". (CQ 31)
    slots:
      - limit_value
      - limit_unit
      - adjustable

  Metric:
    is_a: DomainEntity
    description: A monitoring signal or metric, such as data drift, prediction drift, or CpuUtilization. (CQ 30)

  Task:
    is_a: DomainEntity
    description: >-
      A user goal that has prerequisites or ordered steps, such as "attach a
      Kubernetes cluster" or "perform a safe rollout". (CQ 4, 10)
    slots:
      - precedes

  KnownIssue:
    is_a: DomainEntity
    description: A documented known issue. (CQ 34)
    slots:
      - workaround
      - issue_status

  ErrorMessage:
    is_a: DomainEntity
    description: An error message or code that troubleshooting articles explain. (CQ 35)
    slots:
      - error_code
      - cause_text
      - resolution_text

# ---------------------------------------------------------------------------
# Attribute slots (values, not relationships)
# ---------------------------------------------------------------------------

slots:

  release_status:
    range: ReleaseStatus
  retirement_date:
    range: date
  framework_version:
  policy_effect:
    description: Audit, Deny, DeployIfNotExists, and so on.
  limit_value:
    description: The limit as stated in the text, such as "2-32" or "50".
  limit_unit:
  adjustable:
    range: boolean
    description: True if the limit can be raised through a support request.
  workaround:
  issue_status:
  error_code:
  cause_text:
  resolution_text:

# ---------------------------------------------------------------------------
# Relationship slots. Each is also a predicate an Assertion can use.
# ---------------------------------------------------------------------------

  # --- Generic relationships (broad on purpose; specific ones below refine them)

  supports:
    description: Subject works with or enables the object. Prefer a specific subproperty when one fits.
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  requires:
    description: Subject needs the object first. (CQ 4, 13, 14, 16, 30)
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  part_of:
    description: Subject is a component or member of the object. (CQ 22, 27)
    domain: DomainEntity
    range: DomainEntity
    multivalued: true
    inverse: has_part

  has_part:
    domain: DomainEntity
    range: DomainEntity
    multivalued: true
    inverse: part_of

  replaced_by:
    description: Subject is deprecated or retired in favor of the object. Pair with a time condition for the date. (CQ 33)
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  incompatible_with:
    description: Subject can't be used together with the object. (CQ 18)
    domain: DomainEntity
    range: DomainEntity
    multivalued: true
    symmetric: true

  integrates_with:
    domain: DomainEntity
    range: DomainEntity
    multivalued: true
    symmetric: true

  # --- Compute and jobs

  runs_on:
    description: A job type or capability runs on a compute target. (CQ 1, 25)
    is_a: supports
    domain: DomainEntity
    range: ComputeTarget
    multivalued: true

  has_gpu_support:
    description: A compute target offers GPU for the given endpoint type or job type. (CQ 2)
    is_a: supports
    domain: ComputeTarget
    range: DomainEntity
    multivalued: true

  pipeline_step_type:
    description: A job type can run as a step in a pipeline job. (CQ 25)
    is_a: part_of
    domain: Job
    range: Job
    multivalued: true

  # --- Deployment

  deployable_to:
    description: An asset or model type can be deployed to an endpoint type. (CQ 9, 11)
    is_a: supports
    domain: DomainEntity
    range: Endpoint
    multivalued: true

  hosted_by:
    description: A deployment type runs behind an endpoint type. (CQ 6)
    is_a: part_of
    domain: Deployment
    range: Endpoint
    multivalued: true

  accepts_input_from:
    description: An endpoint or job reads input from a data type, datastore, or service. (CQ 9)
    is_a: supports
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  available_in:
    description: Subject is available in a region. (CQ 8)
    domain: DomainEntity
    range: Region
    multivalued: true

  # --- Identity and access

  supports_auth_method:
    description: A resource or endpoint accepts an authentication method. (CQ 7, 20)
    is_a: supports
    domain: DomainEntity
    range: IdentityConcept
    multivalued: true

  uses_identity:
    description: A resource uses an identity to access other resources. (CQ 14)
    domain: DomainEntity
    range: IdentityConcept
    multivalued: true

  grants:
    description: A role grants a permission or the ability to perform a task. (CQ 12, 13)
    domain: Role
    range: DomainEntity
    multivalued: true

  requires_role:
    description: A task or operation needs the given role at minimum. (CQ 13)
    is_a: requires
    domain: DomainEntity
    range: Role
    multivalued: true

  # --- Network and data protection

  secures:
    description: A security mechanism protects a resource or service. (CQ 16)
    domain: SecurityConcept
    range: DomainEntity
    multivalued: true

  encrypts:
    description: An encryption mechanism protects a kind of data or resource. (CQ 17)
    domain: SecurityConcept
    range: DomainEntity
    multivalued: true

  allows_outbound_to:
    description: A network mode or outbound rule allows traffic to a service. Pair with a network_mode condition. (CQ 15)
    domain: SecurityConcept
    range: DomainEntity
    multivalued: true

  enforces:
    description: A policy constrains a resource or setting. (CQ 19)
    domain: Policy
    range: DomainEntity
    multivalued: true

  # --- Data and storage

  backed_by:
    description: A datastore or resource is stored in an Azure service. (CQ 20)
    domain: DomainEntity
    range: AzureService
    multivalued: true

  # --- Training and AutoML

  uses_algorithm:
    description: An AutoML task or capability can use an algorithm. (CQ 23, 24)
    domain: DomainEntity
    range: Algorithm
    multivalued: true

  supports_task:
    description: A capability or component supports an AutoML task type. (CQ 23)
    is_a: supports
    domain: DomainEntity
    range: AutomlTask
    multivalued: true

  contains_framework:
    description: An environment includes a framework. (CQ 28)
    domain: Asset
    range: Framework
    multivalued: true

  has_input:
    description: A component, tool, or job takes an input of the object type. (CQ 26)
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  has_output:
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  # --- Assets and MLOps

  shareable_via:
    description: An asset type can be shared across workspaces through a resource such as a registry. (CQ 27)
    domain: Asset
    range: Resource
    multivalued: true

  defined_by_schema:
    description: An entity type is defined by a CLI v2 YAML schema. (CQ 29)
    domain: DomainEntity
    range: YamlSchema
    multivalued: true

  computes_metric:
    description: A monitoring capability computes a metric or signal. (CQ 30)
    domain: DomainEntity
    range: Metric
    multivalued: true

  # --- Limits, issues, and procedures

  has_limit:
    description: Subject is subject to a quota or service limit. (CQ 5, 31)
    domain: DomainEntity
    range: Limit
    multivalued: true

  affects:
    description: A known issue or error affects a resource or capability. (CQ 34, 35)
    domain: DomainEntity
    range: DomainEntity
    multivalued: true

  precedes:
    description: A task must be completed before another task. (CQ 4, 10)
    domain: Task
    range: Task
    multivalued: true

  differs_from:
    description: >-
      Placeholder link used when the text compares two things (CQ 3, 6).
      The compared attribute goes in the assertion's conditions or evidence.
    domain: DomainEntity
    range: DomainEntity
    multivalued: true
    symmetric: true
