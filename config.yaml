# Pipeline configuration. Every setting lives here (DESIGN section 9).
# Relative paths resolve against this file's directory.
# Later phases add extraction, resolution, store, and evaluation.

paths:
  out_dir: data/out
  review_dir: review
  state_db: data/out/state.sqlite

ingest:
  # Chunk sizes are estimated as characters / chars_per_token, so no
  # tokenizer is needed and the estimate is deterministic.
  chars_per_token: 4
  chunk_target_tokens: 600
  chunk_max_tokens: 1200
  max_include_depth: 10
  placeholder_format: "[[UNRESOLVED_INCLUDE: {path}]]"
  # Include files whose repo-relative path matches one of these mark the
  # surrounding section (or the whole article, if used before the first
  # H2) as preview.
  preview_include_patterns:
    - "*preview*"
  # Front matter keys copied into documents.jsonl.
  front_matter_keys:
    - title
    - description
    - ms.topic
    - ms.subservice
    - ms.date
    - author

extract:
  vocabulary: vocab/vocabulary.ttl
  # Text that tiers 1 and 2 never match inside. Placeholders for unresolved
  # includes are always skipped.
  mask:
    code_blocks: true      # fenced code
    link_targets: true     # the (url) part of [text](url)
    directives: true       # Learn directive lines such as :::image ...:::
    html_comments: true
    callouts: true         # the [!NOTE] marker itself, not the callout text
  tier1:
    # Single-word labels with a capital letter (Reader, Owner, Bicep) match
    # only with that exact case; other labels match case-insensitively.
    case_sensitive_single_token: true
    # Also match regular plurals of lowercase labels (endpoint -> endpoints,
    # policy -> policies).
    match_plurals: true
  tier2:
    model: urchade/gliner_medium-v2.1               # Apache 2.0
    revision: 40ec419335d09393f298636f471328b722c6da9e
    threshold: 0.5
    max_words: 250        # GLiNER window size; longer text is split at line breaks
    batch_size: 8
    # GLiNER labels are the schema's concrete domain classes, written as
    # words ("ComputeTarget" -> "compute target"). Override a label here
    # when the default reads poorly, or list classes to leave out.
    label_overrides:
      AzureService: Azure service
      AutomlTask: AutoML task
      YamlSchema: YAML schema
      PromptFlowTool: prompt flow tool
    exclude_classes: []
  tier3:
    ollama_url: http://localhost:11434
    model: qwen2.5:7b-instruct      # Apache 2.0
    prompt_file: prompts/tier3_system.md
    predicates_file: schema/generated/ckg.predicates.json
    temperature: 0
    seed: 0
    num_ctx: 8192
    max_output_tokens: 1536
    # Upper bound on assertions per chunk, enforced by the output schema, so
    # long lists don't run into max_output_tokens and get cut off.
    max_assertions_per_chunk: 12
    timeout_seconds: 900
    # Run tier 3 only on chunks with at least this many distinct entities
    # from tiers 1 and 2 (DESIGN 5.2, gating).
    min_distinct_mentions: 2
    # Replace fenced code and Learn code-include lines ([!notebook-python[]...],
    # [!code-...]) with a short marker in the prompt to save CPU time.
    # Evidence must still be an exact substring of the original chunk.
    omit_code_blocks: true
    # Evidence that differs from the chunk only in whitespace is accepted and
    # stored as the chunk's exact text. Anything else is rejected.
    evidence_whitespace_tolerant: true

resolution:
  # IRI base for entities that have no vocabulary concept.
  entity_base: https://example.org/ckg/entity/  # TODO(Scott): real namespace (DESIGN 12)
  # Compare names case-insensitively, with the last word singularized
  # (online endpoints == online endpoint).
  singularize: true
  # Names shorter than this (after normalization) are not resolved and are logged.
  min_name_length: 2
  embedding_model: sentence-transformers/all-MiniLM-L6-v2   # Apache 2.0
  embedding_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  # Pair score = string_weight * rapidfuzz similarity + (1 - string_weight) *
  # embedding cosine similarity. Pairs of names in the same class scoring at
  # or above merge_threshold merge; pairs between review_threshold and
  # merge_threshold go to review/resolution_queue.csv; lower pairs stay apart.
  string_weight: 0.5
  merge_threshold: 0.9
  review_threshold: 0.8
  # Classes whose names are identifiers: near-identical spellings are different
  # things (East US vs East US 2, .../read vs .../delete), so they resolve by
  # exact normalized name only and are never fuzzy-matched or queued.
  exact_match_classes:
    - Permission
    - Region
    - ErrorMessage
    - Limit
    - YamlSchema
  queue_file: review/resolution_queue.csv

corpus:
  # Local clone of spolly74/azure-ai-docs in a sibling folder of this repo.
  repo_root: ../azure-ai-docs
  base_dir: articles/machine-learning
  # Full scope, for later runs.
  exclude:
    - v1/**
    - data-science-virtual-machine/**
    - includes/**          # resolved into articles, not ingested on their own
    - "**/media/**"
  external_include_prefixes:  # left as placeholders (DESIGN 5.1)
    - ~/reusable-content/
    - ~/azure-policy-autogen-docs/
  # First run: articles cited by eval/competency_questions.md, plus known
  # issues, a few YAML schema references, troubleshooting articles, and
  # sample designer components. 77 articles, about 172K words before includes.
