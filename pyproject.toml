[project]
name = "ckg"
version = "0.1.0"
description = "Content knowledge graph pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gliner>=0.2.29",
    "protobuf>=7.36.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rdflib>=7.6.0",
    "spacy>=3.8.16",
    "transformers>=4.51.3,<5",
    "typer>=0.12",
]

[project.scripts]
ckg = "ckg.cli:app"

[dependency-groups]
dev = [
    "linkml>=1.12.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
